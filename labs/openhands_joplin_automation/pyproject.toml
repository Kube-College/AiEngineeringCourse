[project]
name = "openhands-joplin-controller"
version = "0.1.0"
description = "Durable OpenHands controller for the Joplin lab"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "typer>=0.27.2",
]

[project.optional-dependencies]
runtime = [
    "openhands-sdk==1.48.0",
    "openhands-tools==1.48.0",
    "openhands-workspace==1.48.0",
    "openhands-agent-server==1.48.0",
]

[project.scripts]
controller = "openhands_controller.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openhands_controller"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires an explicitly enabled local Docker and model qualification environment"]
